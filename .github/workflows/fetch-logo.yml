name: Deploy site files

on:
  push:
    paths:
      - .github/workflows/fetch-logo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download files and verify sha256
        run: |
          curl -sSL "https://files.catbox.moe/ydqiiq.webp" -o logo.webp
          curl -sSL "https://files.catbox.moe/thg52y.html" -o index.html
          curl -sSL "https://files.catbox.moe/8i9hdm.py" -o market.py
          curl -sSL "https://files.catbox.moe/fba3hh.js" -o companies.js
          echo "75d01f2f0f4ad51d4faa8816beaea1195e274d3e6fd7f7e13ec456b758d4d513  logo.webp" | sha256sum -c -
          echo "4a39ad293741cfc105c7138e5c685496175db00db7a892b08c31c0bbc5483e5e  index.html" | sha256sum -c -
          echo "8d663fbd2ed600494b056765fe1732dd0cdac72239bb64193d126c4371ec0bd6  market.py" | sha256sum -c -
          echo "98c647f3b10dae1892acdc73735be03d076fddc899430a9fe428af27630f3f92  companies.js" | sha256sum -c -

      - name: Clean corrupted temp parts
        run: git rm -r --ignore-unmatch assets/logo_b64

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logo.webp index.html market.py companies.js
          git commit -m "Deploy: tradable companies list + expanded market indicators (sha256 verified)" || echo "no changes"
          git push
