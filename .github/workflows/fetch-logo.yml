name: Deploy logo and index

on:
  push:
    paths:
      - .github/workflows/fetch-logo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download files and verify sha256
        run: |
          curl -sSL "https://files.catbox.moe/ou8dcz.webp" -o logo.webp
          curl -sSL "https://files.catbox.moe/rjb83g.html" -o index.html
          echo "ac8b135f93552af86127eebc124c6ebd9f8221738988239ccef31d753ffd185a  logo.webp" | sha256sum -c -
          echo "fa0ec9144c8784c6ce45851eb30799d9f1e004d095a2d354acbc663d1e5db827  index.html" | sha256sum -c -

      - name: Clean corrupted temp parts
        run: git rm -r --ignore-unmatch assets/logo_b64

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logo.webp index.html
          git commit -m "Deploy HD logo + navy theme index (sha256 verified)" || echo "no changes"
          git push
