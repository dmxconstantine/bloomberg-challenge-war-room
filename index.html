      <div class="clist" id="cList"></div>

      <div class="evhead" id="catHead"></div>
      <div id="catTable"></div>
      <div class="note" id="catCount"></div>
    </div>

  </div>

  <div class="foot">
    <span id="footSrc"></span>
    <span id="footDisc"></span>
  </div>
</div>

    '<input id="fQ" type="text" placeholder="' + esc(l.fSearchPh) + '" value="' + esc(cQ) + '">' +
    '<button class="chip" id="fReset">' + esc(l.reset) + '</button>';
  function bind(id, fn) { var el = document.getElementById(id); if (el) el.onchange = fn; }
  bind("fType", function (e) { cType = e.target.value; renderCatalysts(); });
  bind("fRegion", function (e) { cRegion = e.target.value; renderCatalysts(); });
  bind("fTier", function (e) { cTier = e.target.value; renderCatalysts(); });
  bind("fWeek", function (e) { cWeek = e.target.value; renderCatalysts(); });
  var fq = document.getElementById("fQ");
  fq.oninput = function () { cQ = fq.value; renderCatalysts(); if (fq.value !== document.activeElement.value) {} var el = document.getElementById("fQ"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); };
  document.getElementById("fReset").onclick = function () { cType = cRegion = cTier = cWeek = "All"; cQ = ""; renderCatalysts(); };
  document.getElementById("catHead").innerHTML =
    '<span>' + esc(l.colDate) + '</span><span>' + esc(l.colEvent) + '</span><span>' + esc(l.colType) +
    '</span><span>' + esc(l.colRegion) + '</span><span>' + esc(l.colTier) + '</span>';
  var q = cQ.trim().toLowerCase();
  var evs = CATALYSTS.events.filter(function (e) {
    if (cType !== "All" && e.type !== cType) return false;
    if (cRegion !== "All" && e.region !== cRegion) return false;
    if (cTier !== "All" && e.tier !== cTier) return false;
    if (cWeek !== "All" && e.week !== cWeek) return false;
    if (q && (e.title + " " + e.descEn + " " + e.descCn).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  document.getElementById("catTable").innerHTML = evs.map(function (e) {
    return '<div class="evrow">' +
      '<span class="evdate"><b>' + esc(e.weekday + ' ' + e.day) + '</b>' + esc(e.month) + '</span>' +
      '<span><span class="evtitle">' + esc(e.title) + (e.tag ? '<span class="tag">' + esc(l.etags[e.tag] || e.tag) + '</span>' : '') + '</span>' +
      '<span class="evdesc">' + esc(e.descEn) + '</span><span class="evdesccn">' + esc(e.descCn) + '</span></span>' +
      '<span><span class="badge b-' + e.type + '">' + esc(l.types[e.type] || e.type) + '</span></span>' +
      '<span class="hideS"><span class="badge">' + esc(l.eregions[e.region] || e.region) + '</span></span>' +
      '<span class="hideS"><span class="badge b-' + e.tier + '">' + esc(e.tier) + '</span></span>' +
      '</div>';
  }).join("");
  document.getElementById("catCount").textContent = evs.length + ' / 50 ' + l.shown;
}

/* ---------- chat drawer ---------- */
var chatLoaded = false, chatOpen = false;
function toggleChat(open) {
  chatOpen = open;
  document.getElementById("chatDrawer").className = open ? "chatdrawer open" : "chatdrawer";
  if (open && !chatLoaded) { chatLoaded = true; ensureGiscus(); }
}
document.getElementById("chatTab").onclick = function () { toggleChat(!chatOpen); };
document.getElementById("chatTab").onmouseenter = function () { if (!chatOpen) toggleChat(true); };
document.getElementById("chatClose").onclick = function () { toggleChat(false); };

/* ---------- chat ---------- */
function ensureGiscus() {
  if (document.getElementById("giscus-app")) return;
  var box = document.getElementById("giscusBox");
  if (!box) return;
  var s = document.createElement("script");
  s.id = "giscus-app";
  s.src = "https://giscus.app/client.js";
  s.setAttribute("data-repo", "dmxconstantine/bloomberg-challenge-war-room");
  s.setAttribute("data-repo-id", "R_kgDOUjZOnA");
  s.setAttribute("data-category", "War Room Chat");
  s.setAttribute("data-category-id", "DIC_kwDOUjZOnM4DGLM3");
  s.setAttribute("data-mapping", "pathname");
  s.setAttribute("data-strict", "0");
  s.setAttribute("data-reactions-enabled", "1");
  s.setAttribute("data-emit-metadata", "0");
  s.setAttribute("data-input-position", "top");
  s.setAttribute("data-theme", "dark");
  s.setAttribute("data-lang", LANG === "en" ? "en" : "zh-CN");
  s.crossOrigin = "anonymous";
  s.async = true;
  box.appendChild(s);
}
function setGiscusLang() {
  var f = document.querySelector("iframe.giscus-frame");
  if (!f) return;
  var target = LANG === "en" ? "en" : "zh-CN";
  if (f.contentWindow) {
    f.contentWindow.postMessage({ giscus: { setConfig: { lang: target } } }, "https://giscus.app");
  }
  // 兜底：postMessage 未生效时直接重写 iframe 地址强制切换
  if (f.src && f.src.indexOf("/" + target + "/widget") < 0) {
    f.src = f.src.replace(/giscus\.app\/[a-zA-Z-]+\/widget/, "giscus.app/" + target + "/widget");
  }
}

function renderAll() {
  var l = L();
  renderCatalysts();
  document.getElementById("hSub").textContent = l.sub;
  document.getElementById("tClock").textContent = l.clock;
  document.getElementById("footSrc").textContent = l.src;
  document.getElementById("footDisc").textContent = l.disc;
  document.getElementById("tChat").textContent = l.chat;
  document.getElementById("mChat").textContent = l.chatMeta;
  document.getElementById("chatNote").textContent = l.chatNote;
  document.getElementById("chatTabTxt").textContent = l.chatShort;
  document.getElementById("bZh").className = LANG === "zh" ? "on" : "";
  document.getElementById("bEn").className = LANG === "en" ? "on" : "";
  renderClock(); renderMarket(); renderNews(); renderFocus(); renderCompanies();
  try {
    var bar = document.getElementById("staleBar");
    var src = (LIVE && LIVE.news) ? LIVE.news : (SNAP.news || null);
    var at = src && src.fetchedAt ? new Date(src.fetchedAt).getTime() : 0;
    var ageMin = at ? Math.floor((Date.now() - at) / 60000) : 999;
    if (!LIVE) { bar.style.display = "block"; bar.textContent = l.staleSnap; }
    else if (ageMin > 45) { bar.style.display = "block"; bar.textContent = l.staleWarn.replace("{m}", ageMin); }
    else bar.style.display = "none";
  } catch (e) {}
  if (chatOpen && !chatLoaded) { chatLoaded = true; ensureGiscus(); }
}
document.getElementById("bZh").onclick = function () { LANG = "zh"; try { localStorage.setItem("wr-lang", "zh"); } catch (e) {} renderAll(); setGiscusLang(); };
document.getElementById("bEn").onclick = function () { LANG = "en"; try { localStorage.setItem("wr-lang", "en"); } catch (e) {} renderAll(); setGiscusLang(); };

renderAll();
fetchData();
setInterval(renderClock, 1000);
setInterval(fetchData, 180e3);
</script>
