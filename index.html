<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloomberg Challenge · Trading War Room</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #262d37; --tx: #e8edf3; --tx2: #9aa7b4; --tx3: #6b7885;
    --up: #f0455c; --dn: #1fbf75; --warn: #f5a623; --acc: #4d9fff;
    --sans: -apple-system, "SF Pro Text", "Segoe UI", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--tx); font-family: var(--sans); font-variant-numeric: tabular-nums; }
  .page { max-width: 1280px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
  .topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .topbar h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
  .topbar .sub { color: var(--tx3); font-size: 12px; }
  .spacer { flex: 1; }
  .phase { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: rgba(245,166,35,.15); color: var(--warn); }
  .phase.live { background: rgba(31,191,117,.15); color: var(--dn); }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .lang button { border: none; background: transparent; color: var(--tx2); font-size: 12px; padding: 4px 10px; cursor: pointer; }
  .lang button.on { background: var(--tx); color: #111; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .c4 { grid-column: span 4; } .c8 { grid-column: span 8; } .c5 { grid-column: span 5; } .c7 { grid-column: span 7; } .c12 { grid-column: span 12; }
  .card h2 { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--tx); }
  .card h2 .no { color: var(--tx3); font-weight: 400; margin-right: 6px; }
  .card h2 .meta { float: right; font-weight: 400; font-size: 11px; color: var(--tx3); }
  .cd { display: flex; align-items: baseline; gap: 5px; }
  .cd .n { font-size: 34px; font-weight: 650; }
  .cd .u { font-size: 12px; color: var(--tx3); margin-right: 4px; }
  .lock { font-size: 12px; font-weight: 600; color: var(--warn); margin-top: 6px; }
  .lock.live { color: var(--dn); }
  .note { font-size: 11px; color: var(--tx3); margin-top: 6px; }
  .bar { height: 6px; background: #232a33; border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; background: var(--tx); border-radius: 99px; }
  .sess { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 5px 0; border-top: 1px solid var(--line); }
  .sess:first-of-type { border-top: none; }
  .sess .nm { width: 76px; font-weight: 600; }
  .sess .st { margin-left: auto; color: var(--tx3); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tx3); }
  .dot.open { background: var(--dn); } .dot.pre { background: var(--warn); }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--tx2); font-size: 11px; padding: 2px 9px; border-radius: 99px; cursor: pointer; }
  .chip.on { background: var(--tx); color: #111; border-color: var(--tx); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap: 6px; }
  .tile { border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; cursor: pointer; background: transparent; color: inherit; text-align: left; }
  .tile:hover { background: #1b222b; } .tile.sel { border-color: var(--tx); }
  .tile .nm { font-size: 11px; color: var(--tx2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .pv { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .tile .px { font-size: 14px; font-weight: 600; }
  .tile .cg { font-size: 11px; }
  .up { color: var(--up); } .dn { color: var(--dn); } .fl { color: var(--tx3); }
  .detail { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .detail .dh { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .detail .dn { font-size: 14px; font-weight: 600; }
  .detail .dp { font-size: 17px; font-weight: 650; }
  .detail .x { margin-left: auto; background: transparent; border: 1px solid var(--line); color: var(--tx2); border-radius: 99px; font-size: 11px; padding: 2px 10px; cursor: pointer; }
  .detail svg { width: 100%; height: 120px; display: block; }
  .dmeta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--tx3); margin-top: 6px; }
  .news { display: flex; flex-direction: column; max-height: 560px; overflow-y: auto; }
  .ni { padding: 8px 2px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; display: block; }
  .ni:last-child { border-bottom: none; }
  .ni .t { font-size: 13px; line-height: 1.5; }
  .ni:hover .t { text-decoration: underline; }
  .ni .m { display: flex; gap: 6px; align-items: center; margin-top: 4px; font-size: 11px; color: var(--tx3); }
  .tag { background: rgba(77,159,255,.14); color: var(--acc); border-radius: 99px; padding: 0 8px; font-size: 10px; }
  .fresh { color: var(--up); }
  .frow { display: grid; grid-template-columns: 20px 1.4fr .7fr .8fr 110px; gap: 8px; align-items: center; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .frow:last-child { border-bottom: none; }
  .frow.hd { color: var(--tx3); font-size: 11px; }
  .frow .rn { color: var(--tx3); }
  .frow .fn { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .ft { color: var(--tx3); font-size: 10px; }
  .frow .fp { text-align: right; }
  .frow .fc { text-align: right; }
  .sig { justify-self: end; font-size: 10px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .sig.hot { background: rgba(240,69,92,.15); color: var(--up); }
  .sig.warm { background: rgba(245,166,35,.16); color: var(--warn); }
  .sig.cool { background: #222a34; color: var(--tx2); }
  .fwhy { grid-column: 2 / -1; font-size: 10px; color: var(--tx3); }
  .foot { font-size: 11px; color: var(--tx3); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--tx3); }
  .status .dot { width: 7px; height: 7px; }
  @media (max-width: 900px) { .c4,.c8,.c5,.c7 { grid-column: span 12; } }
</style>
</head>

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function pad(n) { return String(n).padStart(2, "0"); }
function fmtP(v, c) { if (v == null || isNaN(v)) return "--"; var d = Math.abs(v) >= 10000 ? 0 : (Math.abs(v) >= 100 ? 2 : 3); if (c === "%") d = 2; return v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }); }
function fmtT(ts) { var d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function ago(iso) { var d = new Date(iso); if (isNaN(d)) return ""; var m = Math.max(0, Math.floor((Date.now() - d.getTime()) / 60000)); if (m < 60) return m + (LANG === "en" ? "m ago" : " 分钟前"); var h = Math.floor(m / 60); if (h < 24) return h + (LANG === "en" ? "h ago" : " 小时前"); return Math.floor(h / 24) + (LANG === "en" ? "d ago" : " 天前"); }

/* ---------- countdown & sessions ---------- */

function zparts(tz) { var o = {}; new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour12: false, weekday: "short", hour: "2-digit", minute: "2-digit" }).formatToParts(new Date()).forEach(function (p) { o[p.type] = p.value; }); return o; }
function zwd(tz) { return ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(zparts(tz).weekday); }
function renderClock() {
  var now = Date.now(), l = L();
  var left = Math.max(0, END - now);
  document.getElementById("cdD").textContent = Math.floor(left / 864e5);
  document.getElementById("cdH").textContent = pad(Math.floor(left % 864e5 / 36e5));
  document.getElementById("cdM").textContent = pad(Math.floor(left % 36e5 / 6e4));
  document.getElementById("cdS").textContent = pad(Math.floor(left % 6e4 / 1e3));
  [["cdDu", "d", "天"], ["cdHu", "h", "时"], ["cdMu", "m", "分"], ["cdSu", "s", "秒"]].forEach(function (x) { document.getElementById(x[0]).textContent = LANG === "en" ? x[1] : x[2]; });
  document.getElementById("cdNote").textContent = l.cdNote + " · " + l.journey;

  else { lock.textContent = ""; }
  var pct = Math.min(100, Math.max(0, (now - PREP_START) / (END - PREP_START) * 100));
  document.getElementById("prog").style.width = pct + "%";
  document.getElementById("progNote").textContent = pct.toFixed(1) + "% " + l.elapsed;
  var chip = document.getElementById("phaseChip");
  chip.textContent = now < LIVE_START ? l.prep : (now <= END ? l.live : l.ended);
  chip.className = "phase" + (now >= LIVE_START && now <= END ? " live" : "");
  document.getElementById("sessions").innerHTML = MARKETS.map(function (m) {
    var p = zparts(m.tz), hh = parseInt(p.hour, 10) % 24, mm = parseInt(p.minute, 10), mins = hh * 60 + mm, wd = zwd(m.tz);
    var cls = "", txt = l.sessState.closed;
    if (wd === 0 || wd === 6) txt = l.sessState.weekend;
    else for (var i = 0; i < m.segs.length; i++) {
      var s = m.segs[i];
      if (mins >= s[0] - 30 && mins < s[0]) { cls = "pre"; txt = l.sessState.pre + " " + l.sessState.in + " " + pad(Math.floor((s[0] - mins) / 60)) + ":" + pad((s[0] - mins) % 60); }
      else if (mins >= s[0] && mins < s[1]) { cls = "open"; txt = l.sessState.live + " · " + l.sessState.left + " " + pad(Math.floor((s[1] - mins) / 60)) + ":" + pad((s[1] - mins) % 60); }
    }

  }).join("");

/* ---------- data: same-origin data.json (refreshed by GitHub Actions) ---------- */
var LIVE = null;
function fetchData() {
  var ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
  fetch("data.json?t=" + Date.now(), ctl ? { signal: ctl.signal, cache: "no-store" } : { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function (j) { clearTimeout(timer); LIVE = j; renderAll(); })
    .catch(function () { clearTimeout(timer); });
}
function marketData() {
  var src = (LIVE && LIVE.market && LIVE.market.indices) ? LIVE.market : (SNAP.market || null);
  if (!src || !src.indices) return { items: [], at: Date.now(), live: false };
  var live = !!(LIVE && LIVE.market && LIVE.market.indices);
  return { items: src.indices.map(function (i) { var sym = null; SYMBOLS.forEach(function (x) { if (x.t === i.ticker) sym = x; }); return { t: i.ticker, name: LANG === "en" && sym ? sym.en : (sym ? sym.zh : i.name), r: i.region, c: i.currency, price: i.price, chg: i.changePct, spark: i.spark || [] }; }), at: src.fetchedAt ? new Date(src.fetchedAt).getTime() : Date.now(), live: live };
}
function sparkSvg(spark, up) {
  if (!spark || spark.length < 2) return "";
  var w = 640, h = 120, pX = 4, pT = 10, pB = 10;
  var min = Math.min.apply(null, spark), max = Math.max.apply(null, spark), rng = (max - min) || 1;
  var pts = spark.map(function (v, i) { return (pX + i * (w - 2 * pX) / (spark.length - 1)).toFixed(1) + "," + (pT + (1 - (v - min) / rng) * (h - pT - pB)).toFixed(1); });
  var col = up ? "var(--up)" : "var(--dn)";
  return '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none"><polygon points="' + pX + "," + (h - pB) + " " + pts.join(" ") + " " + (w - pX) + "," + (h - pB) + '" fill="' + col + '" opacity="0.08"/><polyline points="' + pts.join(" ") + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round"/></svg>';
}
function renderMarket() {

  if (sel) {
    var pct = sel.spark.length >= 2 ? (sel.spark[sel.spark.length - 1] / sel.spark[0] - 1) * 100 : 0;
    var hi = Math.max.apply(null, sel.spark), lo = Math.min.apply(null, sel.spark);

      '<div class="dmeta"><span>1-mo hourly · ' + sel.spark.length + " " + l.pts + "</span><span>" + l.hi + " " + fmtP(hi, sel.c) + "</span><span>" + l.lo + " " + fmtP(lo, sel.c) + '</span><span class="' + (pct >= 0 ? "up" : "dn") + '">' + l.period + " " + (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%</span></div></div>";
    document.getElementById("mClose").onclick = function () { mSel = null; renderMarket(); };
  } else det.innerHTML = '<div class="note" style="margin:0 0 8px">' + l.clickHint + "</div>";
  var shown = mRegion === "All" ? d.items : d.items.filter(function (i) { return i.r === mRegion; });
  document.getElementById("mGrid").innerHTML = shown.map(function (i) {

  }).join("");
